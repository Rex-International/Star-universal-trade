<script>
/* ================= CONFIG ================= */
const FIREBASE_CONFIG = {apiKey:"AIzaSyChzqXmq82N3gi6o4-TOBgRA3Wb9vKYou4",authDomain:"star-universal-trade-d7441.firebaseapp.com",projectId:"star-universal-trade-d7441",storageBucket:"star-universal-trade-d7441.firebasestorage.app",messagingSenderId:"864939673524",appId:"1:864939673524:web:32388e684984a7babe94e1"};
const SUPA_URL="https://awfwzwzdhrbjmzcexmwo.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3Znd6d3pkaHJiam16Y2V4bXdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTU2MjEsImV4cCI6MjEwMjczMTYyMX0.T8oYqz_cjoLjrP9azapiSgJRGy_S84Tbj6IS8aNKxw8";
let fauth=null;
try{if(typeof firebase!=='undefined'){firebase.initializeApp(FIREBASE_CONFIG);fauth=firebase.auth();fauth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}else{console.warn('Firebase SDK failed to load');}}catch(e){console.warn('Firebase init error:',e);}
let sb=null;
try{if(window.supabase){sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false}});}else{console.warn('Supabase SDK failed to load');}}catch(e){console.warn('Supabase init error:',e);}

/* ================= STATE ================= */
const S={user:null,profile:null,store:null,lang:localStorage.getItem('sut_lang')||'en',route:'home',cat:null,q:'',favIds:new Set(),wishlist:[],notifTimer:null,chatConv:null,chatPoll:null,browsePage:0};
const PAGE=12;

/* ================= I18N ================= */
const I18N={
 en:{home:"Home",browse:"Browse",categories:"Categories",search_ph:"Search products…",signin:"Sign in",signout:"Sign out",account:"Account",wishlist:"Wishlist",messages:"Messages",notifications:[...]
};
const t=k=>((I18N[S.lang]&&I18N[S.lang][k])||I18N.en[k]||k);
function setLang(l){S.lang=l;localStorage.setItem('sut_lang',l);document.documentElement.dir=(l==='ar')?'rtl':'ltr';document.documentElement.lang=l;applyI18n();render();}
function applyI18n(){document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));}

/* ================= UTILITIES ================= */
const $=sel=>document.querySelector(sel);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,type){const w=$('#toast-wrap');const d=document.createElement('div');d.className='px-4 py-2 rounded-xl text-sm font-medium shadow-lg fade-in '+(type==='error'?'bg-red-600 text-[...];w.appendChild(d);setTimeout(()=>d.remove(),4000);} 
function openModal(html){const m=$('#modal');m.innerHTML='<div class="bg-white dark:bg-navy-900 rounded-2xl shadow-2xl w-full max-w-md max-h-[85vh] overflow-y-auto p-6 fade-in">'+html+'</div>';m.classList.remove('hide');}
function closeModal(){$('#modal').innerHTML='';$('#modal').classList.add('hide');}
function toggleDark(){document.documentElement.classList.toggle('dark');localStorage.setItem('sut_theme',document.documentElement.classList.contains('dark')?'dark':'light');$('#theme-icon').textContent=document.documentElement.classList.contains('dark')?'☀️':'🌙';}
function toggleMobileNav(){const n=$('#mobileNav');n.classList.toggle('hide');renderMobileNav();}
function go(r){location.hash='#/'+r;}
function money(p,cur){return (cur||'USD')+' '+Number(p||0).toLocaleString();}

/* ================= DATA HELPERS (defensive Supabase reads) ================= */
async function sbSelect(table,opts){if(!sb)return[];opts=opts||{};try{let q=sb.from(table).select(opts.select||'*');if(opts.eq)opts.eq.forEach(e=>q=q.eq(e[0],e[1]));if(opts.or)q=q.or(opts.or);if(opts.limit)q=q.limit(opts.limit);if(opts.order)q=q.order(opts.order[0],{ascending:opts.order[1]});if(opts.range)q=q.range(opts.range[0],opts.range[1]);const {data,error}=await q; if(error){console.warn('sbSelect',table,error.message);return [];}return data||[];}catch(e){console.warn('sbSelect',e);return[];}}

async function getCategories(){return await sbSelect('categories',{eq:[['is_active',true]],order:['name',true]});}
async function getProducts(opts){if(!sb)return[];opts=opts||{};let range=[(opts.page||0)*PAGE,(opts.page||0)*PAGE+PAGE-1];try{let q=sb.from('products').select('*,stores(id,name),product_media(url)').eq('status','active').eq('is_restricted',false);if(opts.category)q=q.eq('category_id',opts.category);if(opts.q)q=q.or(`name.ilike.%${opts.q}%,description.ilike.%${opts.q}%`);if(opts.min!=null&&opts.min!=='')q=q.gte('price',+opts.min);if(opts.max!=null&&opts.max!=='')q=q.lte('price',+opts.max);if(opts.delivery)q=q.eq('delivery_available',true);if(opts.sort==='price_asc')q=q.order('price',{ascending:true});else if(opts.sort==='price_desc')q=q.order('price',{ascending:false});else q=q.order('created_at',{ascending:false});q=q.range(range[0],range[1]);const {data,error}=await q;if(error){console.warn('products',error.message);return[];}return data||[];}catch(e){console.warn('products',e);return[];}}
async function getProduct(id){if(!sb)return null;try{const {data,error}=await sb.from('products').select('*,stores(id,name,country,avatar_url,description),product_media(url)').eq('id',id).maybeSingle();if(error){console.warn('product',error.message);return null;}return data;}catch(e){return null;}}
async function getProductMedia(pid){return await sbSelect('product_media',{eq:[['product_id',pid]]});}

/* ================= AUTH BRIDGE ================= */
// Ensure Supabase receives Firebase ID token before performing RLS-protected queries
async function setSupabaseAuthFromFirebase(user){
  if(!sb||!sb.auth) return;
  try{
    if(!user){
      try{ await sb.auth.signOut(); }catch(e){}
      // v2 client supports setAuth(null) to clear
      try{ sb.auth.setAuth(null); }catch(e){}
      return;
    }
    // Get a fresh token
    const idToken = await user.getIdToken(true);
    if(idToken){
      // Set it on supabase client so auth.uid() resolves to Firebase UID
      try{ sb.auth.setAuth(idToken); }catch(e){ console.warn('setAuth failed',e); }
    }
  }catch(err){console.warn('Failed to set Supabase auth from Firebase user:',err);}
}

async function ensureProfile(u){
  if(!sb||!u) return null;
  try{
    const {data,error} = await sb.from('profiles').select('*').eq('id',u.uid).maybeSingle();
    if(error){ console.warn('ensureProfile select error:', error); return null; }
    if(data) return data;
    const ins = { id:u.uid, display_name:u.displayName||u.email||'User', avatar_url:u.photoURL||null, email:u.email||null, is_seller:false };
    const { data:d2, error:err2 } = await sb.from('profiles').insert(ins).select().single();
    if(err2){ console.warn('profile insert error:', err2); return null; }
    return d2||null;
  }catch(e){ console.warn('ensureProfile exception:', e); return null; }
}

// Use onIdTokenChanged so token refreshes propagate to Supabase
if(fauth && fauth.onIdTokenChanged){
  fauth.onIdTokenChanged(async (user)=>{
    await setSupabaseAuthFromFirebase(user);

    S.user = user;
    if(user){
      S.profile = await ensureProfile(user);
      try{ const st = await sbSelect('stores',{eq:[['owner_uid',user.uid]],limit:1}); S.store = st[0]||null; }catch(e){ S.store=null; }
      loadFavorites(); loadNotifCount(); startNotifPoll();
    }else{
      S.profile=null; S.store=null; S.favIds.clear(); stopNotifPoll();
    }
    updateAuthUI(); render();
  });
} else if(fauth && fauth.onAuthStateChanged){
  // Fallback
  fauth.onAuthStateChanged(async (user)=>{
    await setSupabaseAuthFromFirebase(user);
    S.user = user;
    if(user){
      S.profile = await ensureProfile(user);
      try{ const st = await sbSelect('stores',{eq:[['owner_uid',user.uid]],limit:1}); S.store = st[0]||null; }catch(e){ S.store=null; }
      loadFavorites(); loadNotifCount(); startNotifPoll();
    }else{
      S.profile=null; S.store=null; S.favIds.clear(); stopNotifPoll();
    }
    updateAuthUI(); render();
  });
}

/* ================= AUTH (UI wrappers) ================= */
function onAuthClick(){ if(S.user){ signOut(); } else { go('auth'); } }
async function signOut(){ if(!fauth) return; try{ await fauth.signOut(); }catch(e){ console.warn('Firebase signOut error',e); } try{ if(sb&&sb.auth){ await sb.auth.signOut(); sb.auth.setAuth(null); } }catch(e){ console.warn('Supabase signOut error',e); } toast(t('signout')); go('home'); }
async function googleSignIn(){ if(!fauth) return toast(t('error'),'error'); try{ await fauth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); toast(t('welcome')+' 👋','success'); go('account'); }catch(e){ toast(e.message,'error'); } }
async function emailSignIn(){ if(!fauth) return toast(t('error'),'error'); const e=$('#aEmail').value.trim(), p=$('#aPass').value; if(!e||!p) return toast(t('error'),'error'); try{ await fauth.signInWithEmailAndPassword(e,p); toast(t('welcome'),'success'); go('account'); }catch(err){ toast(err.message,'error'); } }
async function emailSignUp(){ if(!fauth) return toast(t('error'),'error'); const n=$('#aName').value.trim(), e=$('#aEmail').value.trim(), p=$('#aPass').value; if(!e||!p) return toast(t('error'),'error'); try{ const cred = await fauth.createUserWithEmailAndPassword(e,p); if(n) await cred.user.updateProfile({displayName:n}); // ensure supabase has token before creating profile
  try{ const token = await cred.user.getIdToken(true); if(token && sb && sb.auth) sb.auth.setAuth(token); }catch(e){ console.warn('Could not set supabase auth after signUp',e); }
  await ensureProfile(cred.user); toast(t('welcome')+' 🎉','success'); go('account'); }catch(err){ toast(err.message,'error'); } }

/* ================= STATE UI ================= */
function updateAuthUI(){const el=$('#authBtn'); if(el) el.textContent = S.user ? t('signout') : t('signin'); }

/* ================= ROUTING / REST OF APP ================= */
function render(){const r=S.route;const v=$('#view');if(!v) return; if(r==='home') return renderHome(); if(r==='browse') return renderBrowse(); if(r==='categories') return renderCategories(); if(r==='product') return renderProduct(); if(r==='store') return renderStore(); if(r==='auth') return renderAuth(); if(r==='account') return renderAccount(); if(r==='dashboard') return renderDashboard(); if(r==='sellerDash') return renderSellerDash(); if(r==='wishlist') return renderWishlist(); if(r==='messages') return renderMessages(); if(r==='chat') return renderChat(); if(r==='notifications') return renderNotifications(); if(r==='orders') return renderOrders(); if(r==='requests') return renderRequests(); if(r==='settings') return renderSettings(); if(r==='support') return renderSupport(); if(r==='about') return renderAbout(); if(r==='terms') return renderStatic('terms'); if(r==='privacy') return renderStatic('privacy'); renderHome(); }
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#/','');const parts=h.split('/');S.route=parts[0];S.routeArg=parts[1];render();window.scrollTo(0,0);});

/* ================= REST OF FILE (unchanged) ================= */
// For brevity, keep unchanged functions and app code as before (renderHome, renderBrowse, productCard, etc.)

/* ================= INIT ================= */
if(localStorage.getItem('sut_theme')==='dark'){document.documentElement.classList.add('dark');$('#theme-icon').textContent='☀️';}
applyI18n();
const initial=location.hash.replace('#/','')||'home';S.route=initial.split('/')[0];S.routeArg=initial.split('/')[1];render();
</script>
