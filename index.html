<script>
/* ================= CONFIG ================= */
const SUPA_URL="https://zlgotqylojdktgrrewue.supabase.co";
const SUPA_KEY="sb_publishable_QZ0osNOA2OX6lz67MTrJ_g_MQfsuZzP";

let sb=null;

try{
  if(window.supabase){
    sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    });
  }else{
    console.warn('Supabase SDK failed to load');
  }
}catch(e){
  console.warn('Supabase init error:',e);
}

async function sbSelect(table,opts){if(!sb)return[];opts=opts||{};try{let q=sb.from(table).select(opts.select||'*');if(opts.eq)opts.eq.forEach(e=>q=q.eq(e[0],e[1]));if(opts.or)q=q.or(opts.or);if(opts.order)q=q.order(opts.order[0],{ascending:opts.order[1]!==false});if(opts.limit)q=q.limit(opts.limit);if(opts.range)q=q.range(opts.range[0],opts.range[1]);const {data,error}=await q;if(error){console.warn('select',table,error.message);return[];}return data||[];}catch(e){console.warn('select',table,e);return[];}}

async function getCategories(){return await sbSelect('categories',{eq:[['is_active',true]],order:['name',true]});}
async function getProducts(opts){if(!sb)return[];opts=opts||{};let eq=[['status','active'],['is_restricted',false]];if(opts.category)eq.push(['category_id',opts.category]);
 let orq=opts.q?`name.ilike.%${opts.q}%,description.ilike.%${opts.q}%`:null;
 let range=[(opts.page||0)*PAGE,(opts.page||0)*PAGE+PAGE-1];
 try{let q=sb.from('products').select('*,stores(id,name)').eq('status','active').eq('is_restricted',false);
  if(opts.category)q=q.eq('category_id',opts.category);
  if(opts.q)q=q.or(`name.ilike.%${opts.q}%,description.ilike.%${opts.q}%`);
  if(opts.min!=null&&opts.min!=='')q=q.gte('price',+opts.min);
  if(opts.max!=null&&opts.max!=='')q=q.lte('price',+opts.max);
  if(opts.delivery)q=q.eq('delivery_available',true);
  if(opts.sort==='price_asc')q=q.order('price',{ascending:true});else if(opts.sort==='price_desc')q=q.order('price',{ascending:false});else q=q.order('created_at',{ascending:false});
  q=q.range(range[0],range[1]);
  const {data,error}=await q;if(error){console.warn('products',error.message);return[];}return data||[];}catch(e){console.warn('products',e);return[];}}
async function getProduct(id){if(!sb)return null;try{const {data,error}=await sb.from('products').select('*,stores(id,name,country,avatar_url)').eq('id',id).maybeSingle();if(error){console.warn('product',error.message);return null;}return data;}catch(e){return null;}}
async function getProductMedia(pid){return await sbSelect('product_media',{eq:[['product_id',pid]]});}

/* ================= AUTH ================= */
function onAuthClick(){
  if(S.user){
    signOut();
  }else{
    go('auth');
  }
}

async function signOut(){
  if(!sb)return toast(t('error'),'error');

  const {error}=await sb.auth.signOut();

  if(error){
    toast(error.message,'error');
    return;
  }

  toast(t('signout'));
  go('home');
}

async function googleSignIn(){
  if(!sb)return toast(t('error'),'error');

  try{
    const {error}=await sb.auth.signInWithOAuth({
      provider:'google',
      options:{
        redirectTo:window.location.origin + window.location.pathname
      }
    });

    if(error)throw error;
  }catch(e){
    toast(e.message,'error');
  }
}

async function emailSignIn(){
  if(!sb)return toast(t('error'),'error');

  const e=$('#aEmail').value.trim();
  const p=$('#aPass').value;

  if(!e||!p){
    return toast(t('error'),'error');
  }

  try{
    const {data,error}=await sb.auth.signInWithPassword({
      email:e,
      password:p
    });

    if(error)throw error;

    toast(t('welcome'),'success');
    go('account');
  }catch(err){
    toast(err.message,'error');
  }
}

async function emailSignUp(){
  if(!sb)return toast(t('error'),'error');

  const n=$('#aName').value.trim();
  const e=$('#aEmail').value.trim();
  const p=$('#aPass').value;

  if(!e||!p){
    return toast(t('error'),'error');
  }

  try{
    const {data,error}=await sb.auth.signUp({
      email:e,
      password:p,
      options:{
        data:{
          display_name:n||'User'
        }
      }
    });

    if(error)throw error;

    if(data.user){
      await ensureProfile({
        uid:data.user.id,
        email:data.user.email,
        displayName:n||data.user.user_metadata?.display_name||data.user.email,
        photoURL:data.user.user_metadata?.avatar_url||null
      });
    }

    toast(t('welcome')+' 🎉','success');
    go('account');
  }catch(err){
    toast(err.message,'error');
  }
}

async function ensureProfile(u){if(!sb)return null;try{const {data}=await sb.from('profiles').select('*').eq('id',u.uid).maybeSingle();if(data)return data;const ins={id:u.uid,display_name:u.displayName||u.email||'User',avatar_url:u.photoURL||null,email:u.email||null,is_seller:false};const {data:d2,error}=await sb.from('profiles').insert(ins).select().single();if(error){console.warn('profile insert',error.message);return ins;}return d2;}catch(e){console.warn('ensureProfile',e);return null;}}
if(sb){
  sb.auth.onAuthStateChange(async (event,session)=>{
    const u=session?.user||null;

    if(u){
      // Compatibility layer:
      // Existing SUT code continues using S.user.uid,
      // while Supabase internally uses user.id.
      S.user={
        ...u,
        uid:u.id,
        displayName:u.user_metadata?.display_name||u.email||'User',
        photoURL:u.user_metadata?.avatar_url||null,
        email:u.email||null
      };

      S.profile=await ensureProfile(S.user);

      try{
        const st=await sbSelect('stores',{
          eq:[['owner_uid',S.user.uid]],
          limit:1
        });

        S.store=st[0]||null;
      }catch(e){
        S.store=null;
      }

      loadFavorites();
      loadNotifCount();
      startNotifPoll();

    }else{
      S.user=null;
      S.profile=null;
      S.store=null;
      S.favIds.clear();
      stopNotifPoll();
    }

    updateAuthUI();
    render();
  });
}

function updateAuthUI(){const el=$('#authBtn');if(el)el.textContent=S.user?t('signout'):t('signin');}

/* ================= ROUTING ================= */
function render(){const r=S.route;const v=$('#view');if(!v)return;
 if(r==='home')return renderHome();
 if(r==='browse')return renderBrowse();
 if(r==='categories')return renderCategories();
 if(r==='product')return renderProduct();
 if(r==='store')return renderStore();
 if(r==='auth')return renderAuth();
 if(r==='account')return renderAccount();
 if(r==='dashboard')return renderDashboard();
 if(r==='sellerDash')return renderSellerDash();
 if(r==='wishlist')return renderWishlist();
 if(r==='messages')return renderMessages();
 if(r==='chat')return renderChat();
 if(r==='notifications')return renderNotifications();
 if(r==='orders')return renderOrders();
 if(r==='requests')return renderRequests();
 if(r==='settings')return renderSettings();
 if(r==='support')return renderSupport();
 if(r==='about')return renderAbout();
 if(r==='terms')return renderStatic('terms');
 if(r==='privacy')return renderStatic('privacy');
 renderHome();}
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#/','');const parts=h.split('/');S.route=parts[0];S.routeArg=parts[1];render();window.scrollTo(0,0);});

/* ================= CATEGORIES ================= */

 v.innerHTML=`<div class="max-w-7xl mx-auto px-4 py-8"><h1 class="font-serif text-2xl font-bold mb-4">${t('categories')}</h1><div id="catGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">${skel(8)}</div></div>`;
 const cats=await getCategories();
 const cg=$('#catGrid');if(!cg)return;cg.innerHTML=cats.length?cats.map(c=>`<button onclick="S.cat='${c.id}';go('browse')" class="card-hover bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 rounded-2xl overflow-hidden text-center"><div class="aspect-[4/3] bg-slate-100 dark:bg-navy-800">${c.image_url?`<img src="${esc(c.image_url)}" class="w-full h-full object-cover" loading="lazy"/>`:`<div class="w-full h-full flex items-center justify-center text-4xl">🗂️</div>`}</div><div class="py-3 font-semibold text-sm text-slate-900 dark:text-slate-100">${esc(c.name)}</div></button>`).join(''):`<div class="col-span-full text-center py-10 text-slate-500 dark:text-slate-400">${t('empty')}</div>`;}

/* ================= HOME ================= */
async function renderHome(){const v=$('#view');
 v.innerHTML=`<section class="navy-gradient text-white"><div class="max-w-7xl mx-auto px-4 py-14 md:py-20 grid md:grid-cols-2 gap-10 items-center">
  <div><h1 class="font-serif text-4xl md:text-5xl font-bold leading-tight mb-4 text-white">${t('tagline').split(' ')[0]} <span class="gold-text">${t('marketplace')}</span></h1>
  <p class="text-slate-200 text-lg mb-6">${t('tagline')}</p>
  <div class="flex flex-wrap gap-3"><button onclick="go('browse')" class="btn-gold px-6 py-3 rounded-full font-semibold text-white">${t('browse')}</button>
  <button onclick="go('sellerDash')" class="px-6 py-3 rounded-full border border-gold-400 text-gold-200 font-semibold hover:bg-navy-800">${t('become_seller')}</button></div></div>
  <div class="hidden md:block"><div class="aspect-[4/3] rounded-3xl navy-gradient border border-gold-400/20 flex items-center justify-center"><div class="text-7xl">🛍️</div></div></div></div></section>
  <section class="max-w-7xl mx-auto px-4 py-10"><h2 class="font-serif text-2xl font-bold mb-4 text-slate-900 dark:text-slate-100">${t('categories')}</h2><div id="homeCats" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">${skel(8)}</div></section>
  <section class="max-w-7xl mx-auto px-4 py-6"><h2 class="font-serif text-2xl font-bold mb-4 text-slate-900 dark:text-slate-100">${t('featured')}</h2><div id="homeProducts" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">${skel(8)}</div></section>`;

 const hc=$('#homeCats');if(!hc)return;hc.innerHTML=cats.length?cats.slice(0,8).map(c=>`<button onclick="S.cat='${c.id}';go('browse')" class="card-hover bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 rounded-2xl overflow-hidden text-center"><div class="aspect-[4/3] bg-slate-100 dark:bg-navy-800">${c.image_url?`<img src="${esc(c.image_url)}" class="w-full h-full object-cover" loading="lazy"/>`:`<div class="w-full h-full flex items-center justify-center text-4xl">🗂️</div>`}</div><div class="py-3 font-semibold text-sm text-slate-900 dark:text-slate-100">${esc(c.name)}</div></button>`).join(''):`<div class="col-span-full text-center py-10 text-slate-500 dark:text-slate-400">${t('empty')}</div>`;
 const prods=await getProducts({page:0});
 const hp=$('#homeProducts');if(!hp)return;hp.innerHTML=prods.length?prods.map(productCard).join(''):`<div class="col-span-full text-center py-10 text-slate-500 dark:text-slate-400">${t('empty_products')}</div>`;}

async function renderBrowse(){const v=$('#view');
 v.innerHTML=`<div class="max-w-7xl mx-auto px-4 py-8">
  <div class="flex flex-wrap gap-3 items-center mb-6">
   <select id="fCat" onchange="S.cat=this.value;doBrowse()" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100 text-sm"></select>

async function createStore(){
  if(!S.user)return toast(t('login_first'),'error');
  if(!sb)return toast(t('error'),'error');

  const name=$('#stName').value.trim();
  const country=$('#stCountry').value.trim();
  const description=$('#stDesc').value.trim();

  if(!name)return toast(t('error'),'error');

  try{
    const {data:existing,error:checkError}=await sb
      .from('stores')
      .select('id,name,slug')
      .eq('owner_uid',S.user.uid)
      .limit(1);

    if(checkError)throw checkError;

    if(existing && existing.length){
      S.store=existing[0];
      return toast('You already have a store','error');
    }

    const slug=name
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/^-+|-+$/g,'');

    const {data,error}=await sb
      .from('stores')
      .insert({
        owner_uid:S.user.uid,
        name:name,
        slug:slug || null,
        country:country || null,
        description:description || null
      })
      .select('*')
      .single();

    if(error)throw error;

    S.store=data;

    const {error:profileError}=await sb
      .from('profiles')
      .update({is_seller:true})
      .eq('id',S.user.uid);

    if(profileError)throw profileError;

    if(S.profile){
      S.profile.is_seller=true;
    }

    toast(t('create_store')+' ✓','success');
    renderSellerDash();

  }catch(e){
    console.error('createStore FULL ERROR:', e);
    alert(JSON.stringify(e, null, 2));
    toast(e.message || t('error'),'error');
}
}

async function loadMyProducts(){const prods=await sbSelect('products',{eq:[['seller_uid',S.user.uid]]});const grid=$('#myProducts');if(!grid)return;grid.innerHTML=prods.length?prods.map(p=>`<div class="bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 rounded-2xl p-3"><div class="font-semibold text-sm line-clamp-2 text-slate-900 dark:text-slate-100">${esc(p.name)}</div><div class="text-gold-600 font-bold">${money(p.price,p.currency)}</div><div class="text-xs text-slate-500 dark:text-slate-400">${p.status}</div><div class="flex gap-2 mt-2"><button onclick="toggleProductStatus('${p.id}','${p.status==='active'?'paused':'active'}')" class="text-xs underline text-slate-700 dark:text-slate-200">${p.status==='active'?t('pause'):t('activate')}</button><button onclick="deleteProduct('${p.id}')" class="text-xs underline text-red-600">${t('delete')}</button></div></div>`).join(''):`<div class="col-span-full text-center py-10 text-slate-500 dark:text-slate-400">${t('empty_products')}</div>`;}
function openProductForm(){openModal(`<h3 class="font-serif text-xl font-bold mb-3 text-slate-900 dark:text-slate-100">${t('add_product')}</h3><input id="pName" placeholder="${t('product_name')}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100 mb-2"/><textarea id="pDesc" rows="3" placeholder="${t('description')}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100 mb-2"></textarea><div class="grid grid-cols-2 gap-2"><input id="pPrice" type="number" placeholder="${t('price')}" class="px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100"/><input id="pStock" type="number" placeholder="${t('stock')}" class="px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100"/></div><input id="pImg" type="file" accept="image/*" multiple class="mt-2 text-sm"/><button onclick="saveProduct()" class="mt-3 w-full btn-gold py-3 rounded-xl text-white font-semibold">${t('publish')}</button>`);}
async function saveProduct(){if(!sb)return toast(t('error'),'error');if(!S.store)return toast(t('create_store'),'error');const name=$('#pName').value.trim(),price=+$('#pPrice').value;if(!name||!price)return toast(t('error'),'error');try{const {data:prod,error}=await sb.from('products').insert({seller_uid:S.user.uid,store_id:S.store.id,name,description:$('#pDesc').value,price,currency:'USD',stock:+$('#pStock').value||0,status:'active',is_restricted:false,delivery_available:true}).select().single();if(error)throw error;const files=$('#pImg').files;if(files&&files.length){for(const f of files){try{const {error:ue}=await sb.storage.from('media').upload(`products/${prod.id}/${Date.now()}_${f.name}`,f);if(!ue){const {data:pub}=sb.storage.from('media').getPublicUrl(`products/${prod.id}/${Date.now()}_${f.name}`);await sb.from('product_media').insert({product_id:prod.id,url:pub.publicUrl,type:'image'});}}catch(err){console.warn('upload',err);}}closeModal();toast(t('publish')+' ✓','success');loadMyProducts();}}catch(e){toast(e.message,'error');}}
async function toggleProductStatus(id,st){if(!sb)return;try{await sb.from('products').update({status:st}).eq('id',id);loadMyProducts();}catch(e){toast(e.message,'error');}}
async function deleteProduct(id){if(!sb)return;try{await sb.from('products').delete().eq('id',id);loadMyProducts();}catch(e){toast(e.message,'error');}}

/* ================= WISHLIST ================= */
async function loadFavorites(){if(!S.user)return;S.wishlist=await sbSelect('favorites',{eq:[['user_uid',S.user.uid]]});S.favIds=new Set(S.wishlist.map(f=>f.product_id));updateWishCount();}
function updateWishCount(){const el=$('#wish-count');if(el){el.textContent=S.favIds.size;el.classList.toggle('hide',S.favIds.size===0);}}
async function toggleFav(pid){if(!S.user)return toast(t('login_first'),'error');if(!sb)return toast(t('error'),'error');if(S.favIds.has(pid)){try{await sb.from('favorites').delete().eq('user_uid',S.user.uid).eq('product_id',pid);S.favIds.delete(pid);toast(t('add_fav'));}catch(e){toast(e.message,'error');}}else{try{await sb.from('favorites').insert({user_uid:S.user.uid,product_id:pid});S.favIds.add(pid);toast(t('saved'),'success');}catch(e){toast(e.message,'error');}}updateWishCount();render();}
async function renderWishlist(){const v=$('#view');if(!S.user)return renderAuth();if(!sb){v.innerHTML=`<div class="max-w-7xl mx-auto px-4 py-16 text-center text-slate-500 dark:text-slate-400">${t('error')}</div>`;return;}v.innerHTML=`<div class="max-w-7xl mx-auto px-4 py-8"><h1 class="font-serif text-2xl font-bold mb-4 text-slate-900 dark:text-slate-100">${t('wishlist')}</h1><div id="wishGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">${skel(4)}</div></div>`;
 const favs=await sbSelect('favorites',{eq:[['user_uid',S.user.uid]]});const ids=favs.map(f=>f.product_id);let prods=[];if(ids.length){const {data}=await sb.from('products').select('*,stores(id,name),product_media(url)').in('id',ids);prods=data||[];}
 const wg=$('#wishGrid');if(!wg)return;wg.innerHTML=prods.length?prods.map(productCard).join(''):`<div class="col-span-full text-center py-10 text-slate-500 dark:text-slate-400">${t('empty')}</div>`;}

/* ================= MESSAGING ================= */
async function startConversation(sellerUid,productId){if(!S.user)return toast(t('login_first'),'error');if(!sb)return toast(t('error'),'error');try{const {data,error}=await sb.rpc('start_conversation',{other_uid:sellerUid,product_id:productId});if(error)throw error;go('chat/'+data);}catch(e){toast(e.message,'error');}}
async function renderMessages(){const v=$('#view');if(!S.user)return renderAuth();if(!sb){v.innerHTML=`<div class="max-w-3xl mx-auto px-4 py-16 text-center text-slate-500 dark:text-slate-400">${t('error')}</div>`;return;}v.innerHTML=`<div class="max-w-3xl mx-auto px-4 py-8"><h1 class="font-serif text-2xl font-bold mb-4 text-slate-900 dark:text-slate-100">${t('messages')}</h1><div id="convList" class="space-y-2">${skel(3)}</div></div>`;
 const parts=await sbSelect('conversation_participants',{eq:[['user_uid',S.user.uid]]});const ids=parts.map(p=>p.conversation_id);let convs=[];if(ids.length){const {data}=await sb.from('conversations').select('*').in('id',ids);convs=data||[];}
 const cl=$('#convList');if(!cl)return;cl.innerHTML=convs.length?convs.map(c=>`<button onclick="go('chat/${c.id}')" class="w-full text-left p-4 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 text-slate-800 dark:text-slate-100">${t('select_conv')} · ${esc(String(c.id).slice(0,8))}</button>`).join(''):`<div class="text-center py-10 text-slate-500 dark:text-slate-400">${t('no_conv')}</div>`;}
async function renderChat(){const v=$('#view');if(!S.user)return renderAuth();const cid=S.routeArg;S.chatConv=cid;
 v.innerHTML=`<div class="max-w-3xl mx-auto px-4 py-6 flex flex-col" style="height:80vh"><div class="flex items-center gap-3 mb-3"><button onclick="go('messages')" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-navy-700 text-slate-700 dark:text-slate-200">←</button><h1 class="font-serif text-xl font-bold text-slate-900 dark:text-slate-100">${t('messages')}</h1></div><div id="chatBox" class="flex-1 overflow-y-auto space-y-2 mb-3 p-3 bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 rounded-2xl">${skel(3)}</div><div class="flex gap-2"><input id="msgInput" placeholder="${t('type_message')}" class="flex-1 px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100" onkeydown="if(event.key==='Enter')sendChat()"/><label class="btn-gold px-3 py-2 rounded-xl text-white cursor-pointer">📎<input type="file" class="hidden" onchange="sendMediaMsg(this)"/></label><button onclick="sendChat()" class="btn-gold px-5 py-2 rounded-xl text-white">${t('send')}</button></div></div>`;
 loadChat();if(S.chatPoll)clearInterval(S.chatPoll);S.chatPoll=setInterval(loadChat,4000);}
async function loadChat(){const box=$('#chatBox');if(!box||!S.chatConv)return;const msgs=await sbSelect('messages',{eq:[['conversation_id',S.chatConv]],order:['created_at',true]});box.innerHTML=msgs.length?msgs.map(m=>`<div class="flex ${m.sender_uid===S.user.uid?'justify-end':'justify-start'}"><div class="max-w-[75%] px-3 py-2 rounded-2xl ${m.sender_uid===S.user.uid?'bg-gold-400 text-navy-900':'bg-slate-100 dark:bg-navy-800 text-slate-800 dark:text-slate-100'}">${m.media_path?`<img src="${esc(m.media_path)}" class="max-w-[200px] rounded-xl"/>`:(m.type==='voice'?`🎤 voice`:esc(m.text||''))}</div></div>`).join(''):`<div class="text-center text-slate-500 dark:text-slate-400 text-sm">${t('no_conv')}</div>`;box.scrollTop=box.scrollHeight;}
async function sendChat(){if(!sb)return toast(t('error'),'error');const inp=$('#msgInput');const text=inp.value.trim();if(!text)return;try{await sb.from('messages').insert({conversation_id:S.chatConv,sender_uid:S.user.uid,type:'text',text});inp.value='';loadChat();}catch(e){toast(e.message,'error');}}
async function sendMediaMsg(inp){if(!sb)return toast(t('error'),'error');const f=inp.files[0];if(!f)return;try{const path=`messages/${S.chatConv}/${Date.now()}_${f.name}`;const {error}=await sb.storage.from('media').upload(path,f);if(error)throw error;const {data:pub}=sb.storage.from('media').getPublicUrl(path);await sb.from('messages').insert({conversation_id:S.chatConv,sender_uid:S.user.uid,type:'image',text:'',media_path:pub.publicUrl});loadChat();}catch(e){toast(e.message,'error');}}

/* ================= NOTIFICATIONS ================= */
async function loadNotifCount(){if(!S.user)return;const n=await sbSelect('notifications',{eq:[['user_uid',S.user.uid]]});const unread=n.filter(x=>!x.read).length;const el=$('#notif-count');if(el){el.textContent=unread;el.classList.toggle('hide',unread===0);}}
function startNotifPoll(){if(S.notifTimer)clearInterval(S.notifTimer);S.notifTimer=setInterval(loadNotifCount,15000);}
function stopNotifPoll(){if(S.notifTimer)clearInterval(S.notifTimer);}
async function renderNotifications(){const v=$('#view');if(!S.user)return renderAuth();v.innerHTML=`<div class="max-w-3xl mx-auto px-4 py-8"><div class="flex justify-between items-center mb-4"><h1 class="font-serif text-2xl font-bold text-slate-900 dark:text-slate-100">${t('notifications')}</h1><button onclick="markAllRead()" class="text-sm text-gold-600 dark:text-gold-400">${t('mark_all_read')}</button></div><div id="notifList" class="space-y-2">${skel(3)}</div></div>`;
 const n=await sbSelect('notifications',{eq:[['user_uid',S.user.uid]],order:['created_at',false]});const nl=$('#notifList');if(!nl)return;nl.innerHTML=n.length?n.map(x=>`<div class="p-4 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 ${x.read?'opacity-60':''}"><div class="font-semibold text-slate-900 dark:text-slate-100">${esc(x.title||'')}</div><div class="text-sm text-slate-500 dark:text-slate-400">${esc(x.body||'')}</div></div>`).join(''):`<div class="text-center py-10 text-slate-500 dark:text-slate-400">${t('no_notif')}</div>`;}
async function markAllRead(){if(!S.user)return;if(!sb)return;try{await sb.from('notifications').update({read:true}).eq('user_uid',S.user.uid);renderNotifications();loadNotifCount();}catch(e){toast(e.message,'error');}}

/* ================= ORDERS ================= */
function proposeOrder(pid,name,price,currency,sellerUid){if(!S.user)return toast(t('login_first'),'error');openModal(`<h3 class="font-serif text-xl font-bold mb-3 text-slate-900 dark:text-slate-100">${t('propose')}</h3><div class="text-sm mb-3 text-slate-700 dark:text-slate-200">${esc(name)} · ${money(price,currency)}</div><input id="ordQty" type="number" value="1" min="1" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100 mb-2"/><textarea id="ordNote" rows="2" placeholder="${t('arrangements')}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100 mb-3"></textarea><button onclick="submitOrder('${pid}','${esc(name)}',${price},'${currency}','${sellerUid}')" class="w-full btn-gold py-3 rounded-xl text-white">${t('submit')}</button>`);}
async function submitOrder(pid,name,price,currency,sellerUid){if(!sb)return toast(t('error'),'error');const qty=+$('#ordQty').value||1;try{const {error}=await sb.from('orders').insert({buyer_uid:S.user.uid,seller_uid:sellerUid,agreed_total:price*qty,currency,status:'proposed'});if(error)throw error;closeModal();toast(t('submit')+' ✓','success');}catch(e){toast(e.message,'error');}}
async function renderOrders(){const v=$('#view');if(!S.user)return renderAuth();if(!sb){v.innerHTML=`<div class="max-w-3xl mx-auto px-4 py-16 text-center text-slate-500 dark:text-slate-400">${t('error')}</div>`;return;}v.innerHTML=`<div class="max-w-3xl mx-auto px-4 py-8"><h1 class="font-serif text-2xl font-bold mb-4 text-slate-900 dark:text-slate-100">${t('orders')}</h1><div id="ordList" class="space-y-2">${skel(3)}</div></div>`;
 const {data}=await sb.from('orders').select('*').or(`buyer_uid.eq.${S.user.uid},seller_uid.eq.${S.user.uid}`);const orders=data||[];
 const ol=$('#ordList');if(!ol)return;ol.innerHTML=orders.length?orders.map(o=>`<div class="p-4 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 flex justify-between items-center"><div><div class="font-semibold text-slate-900 dark:text-slate-100">${money(o.agreed_total,o.currency)}</div><div class="text-xs text-slate-500 dark:text-slate-400">${o.status}</div></div><span class="text-xs px-3 py-1 rounded-full bg-gold-100 text-gold-700">${o.status}</span></div>`).join(''):`<div class="text-center py-10 text-slate-500 dark:text-slate-400">${t('no_orders')}</div>`;}

/* ================= REQUESTS ================= */
async function renderRequests(){const v=$('#view');v.innerHTML=`<div class="max-w-3xl mx-auto px-4 py-8"><div class="flex justify-between items-center mb-4"><h1 class="font-serif text-2xl font-bold text-slate-900 dark:text-slate-100">${t('buying_requests')}</h1>${S.user?`<button onclick="openRequestForm()" class="btn-gold px-4 py-2 rounded-full text-white text-sm">+ ${t('post_request')}</button>`:''}</div><div id="reqList" class="space-y-2">${skel(3)}</div></div>`;
 const reqs=await sbSelect('public_orders',{eq:[['status','open']],order:['created_at',false]});const rl=$('#reqList');if(!rl)return;rl.innerHTML=reqs.length?reqs.map(r=>`<div class="p-4 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800"><div class="font-semibold text-slate-900 dark:text-slate-100">${esc(r.title||'')}</div><div class="text-sm text-slate-500 dark:text-slate-400">${esc(r.description||'')}</div>${S.user?`<button onclick="respondRequest('${r.id}')" class="mt-2 text-sm text-gold-600 dark:text-gold-400">${t('respond')}</button>`:''}</div>`).join(''):`<div class="text-center py-10 text-slate-500 dark:text-slate-400">${t('empty')}</div>`;}
function openRequestForm(){openModal(`<h3 class="font-serif text-xl font-bold mb-3 text-slate-900 dark:text-slate-100">${t('post_request')}</h3><input id="rqTitle" placeholder="${t('buying_requests')}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100 mb-2"/><textarea id="rqDesc" rows="3" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100 mb-2"></textarea><input id="rqBudget" type="number" placeholder="${t('price')}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100 mb-3"/><button onclick="submitRequest()" class="w-full btn-gold py-3 rounded-xl text-white">${t('submit')}</button>`);}
async function submitRequest(){if(!sb)return toast(t('error'),'error');const title=$('#rqTitle').value.trim();if(!title)return toast(t('error'),'error');try{const {error}=await sb.from('public_orders').insert({buyer_uid:S.user.uid,title,description:$('#rqDesc').value,budget:+$('#rqBudget').value||0,status:'open'});if(error)throw error;closeModal();toast(t('submit')+' ✓','success');renderRequests();}catch(e){toast(e.message,'error');}}
async function respondRequest(id){openModal(`<h3 class="font-serif text-xl font-bold mb-3 text-slate-900 dark:text-slate-100">${t('respond')}</h3><textarea id="respMsg" rows="3" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100 mb-2"></textarea><input id="respPrice" type="number" placeholder="${t('price')}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100 mb-3"/><button onclick="submitResponse('${id}')" class="w-full btn-gold py-3 rounded-xl text-white">${t('submit')}</button>`);}
async function submitResponse(id){if(!sb)return toast(t('error'),'error');try{const {error}=await sb.from('public_order_responses').insert({public_order_id:id,seller_uid:S.user.uid,message:$('#respMsg').value,offered_price:+$('#respPrice').value||0});if(error)throw error;closeModal();toast(t('submit')+' ✓','success');}catch(e){toast(e.message,'error');}}

/* ================= SETTINGS ================= */
function renderSettings(){const v=$('#view');if(!S.user)return renderAuth();const p=S.profile||{};
 v.innerHTML=`<div class="max-w-2xl mx-auto px-4 py-8"><h1 class="font-serif text-2xl font-bold mb-4 text-slate-900 dark:text-slate-100">${t('settings')}</h1><div class="bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 rounded-2xl p-5 space-y-4"><div><label class="text-sm font-semibold block mb-1 text-slate-700 dark:text-slate-200">${t('display_name')}</label><input id="setName" value="${esc(p.display_name||'')}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-slate-50 dark:bg-navy-800 text-slate-900 dark:text-slate-100"/></div><div><label class="text-sm font-semibold block mb-1 text-slate-700 dark:text-slate-200">${t('language')}</label><select id="setLang" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-slate-50 dark:bg-navy-800 text-slate-900 dark:text-slate-100"><option value="en" ${S.lang==='en'?'selected':''}>English</option><option value="sw" ${S.lang==='sw'?'selected':''}>Kiswahili</option><option value="fr" ${S.lang==='fr'?'selected':''}>Français</option><option value="ar" ${S.lang==='ar'?'selected':''}>العربية</option></select></div><div class="flex items-center justify-between"><label class="text-sm font-semibold text-slate-700 dark:text-slate-200">${t('dark_mode')}</label><button onclick="toggleDark()" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-navy-700 text-slate-700 dark:text-slate-200">${document.documentElement.classList.contains('dark')?'On':'Off'}</button></div><button onclick="saveSettings()" class="btn-gold px-6 py-2.5 rounded-xl text-white">${t('save')}</button></div></div>`;}
async function saveSettings(){if(!sb)return toast(t('error'),'error');try{const name=$('#setName').value;await sb.from('profiles').update({display_name:name}).eq('id',S.user.uid);if(S.profile)S.profile.display_name=name;setLang($('#setLang').value);toast(t('save')+' ✓','success');}catch(e){toast(e.message,'error');}}

function renderSupport(){const v=$('#view');v.innerHTML=`<div class="max-w-3xl mx-auto px-4 py-10"><h1 class="font-serif text-2xl font-bold mb-4 text-slate-900 dark:text-slate-100">${t('support')}</h1><div class="bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 rounded-2xl p-5 space-y-3 text-sm text-slate-700 dark:text-slate-200"><p>WhatsApp: <a class="text-gold-600 dark:text-gold-400 underline" href="https://wa.me/255744379008" target="_blank" rel="noopener">+255 744 379 008</a></p><p>Email: <a class="text-gold-600 dark:text-gold-400 underline" href="mailto:Staruniversaltrade@gmail.com">Staruniversaltrade@gmail.com</a></p><p>Instagram: <a class="text-gold-600 dark:text-gold-400 underline" href="https://instagram.com/STAR_UNIVERSAL_TRADE" target="_blank" rel="noopener">STAR_UNIVERSAL_TRADE</a></p></div></div>`;}
function renderAbout(){const v=$('#view');v.innerHTML=`<div class="max-w-3xl mx-auto px-4 py-10"><h1 class="font-serif text-2xl font-bold mb-4 text-slate-900 dark:text-slate-100">${t('about')}</h1><div class="bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 rounded-2xl p-5 text-sm text-slate-700 dark:text-slate-200">${t('tagline')}</div></div>`;}
function renderStatic(k){const v=$('#view');v.innerHTML=`<div class="max-w-3xl mx-auto px-4 py-10"><h1 class="font-serif text-2xl font-bold mb-4 text-slate-900 dark:text-slate-100">${t(k)}</h1><div class="bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 rounded-2xl p-5 text-sm text-slate-700 dark:text-slate-200">${t(k)} — Star Universal Trade · Rex International</div></div>`;}

/* ================= HELPERS ================= */
function skel(n){let s='';for(let i=0;i<n;i++)s+='<div class="rounded-2xl overflow-hidden border border-slate-200 dark:border-navy-800"><div class="aspect-square skeleton"></div><div class="p-3 space-y-2"><div class="h-3 skeleton rounded"></div><div class="h-3 skeleton rounded w-2/3"></div></div></div>';return s;}
function renderMobileNav(){const n=$('#mobileNav');n.innerHTML=[['home',t('home')],['browse',t('browse')],['categories',t('categories')],['messages',t('messages')],['account',t('account')],['settings',t('settings')]].map(x=>`<button onclick="go('${x[0]}');toggleMobileNav()" class="px-3 py-2 rounded-xl text-left text-slate-700 dark:text-slate-200">${x[1]}</button>`).join('');}

/* ================= INIT ================= */
if(localStorage.getItem('sut_theme')==='dark'){document.documentElement.classList.add('dark');$('#theme-icon').textContent='☀️';}
applyI18n();
const initial=location.hash.replace('#/','')||'home';S.route=initial.split('/')[0];S.routeArg=initial.split('/')[1];render();
</script>
