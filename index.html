/* ================= DATA HELPERS (defensive Supabase reads) ================= */
async function sbSelect(table,opts){opts=opts||{};try{let q=sb.from(table).select(opts.select||'*');if(opts.eq)opts.eq.forEach(e=>q=q.eq(e[0],e[1]));if(opts.or)q=q.or(opts.or);if(opts.order)q=q.order(opts.order[0],{ascending:opts.order[1]!==false});if(opts.limit)q=q.limit(opts.limit);if(opts.range)q=q.range(opts.range[0],opts.range[1]);const {data,error}=await q;if(error){console.warn('select',table,error.message);return[];}return data||[];}catch(e){console.warn('select',table,e);return[];}}

async function getCategories(){return await sbSelect('categories',{eq:[['is_active',true]],order:['name',true]});}
async function getProducts(opts){opts=opts||{};let eq=[['status','active'],['is_restricted',false]];if(opts.category)eq.push(['category_id',opts.category]);
 let orq=opts.q?`name.ilike.%${opts.q}%,description.ilike.%${opts.q}%`:null;
 let range=[(opts.page||0)*PAGE,(opts.page||0)*PAGE+PAGE-1];
 try{let q=sb.from('products').select('*,stores(id,name)').eq('status','active').eq('is_restricted',false);
  if(opts.category)q=q.eq('category_id',opts.category);
  if(opts.q)q=q.or(`name.ilike.%${opts.q}%,description.ilike.%${opts.q}%`);
  if(opts.min!=null&&opts.min!=='')q=q.gte('price',+opts.min);
  if(opts.max!=null&&opts.max!=='')q=q.lte('price',+opts.max);
  if(opts.delivery)q=q.eq('delivery_available',true);
  if(opts.sort==='price_asc')q=q.order('price',{ascending:true});else if(opts.sort==='price_desc')q=q.order('price',{ascending:false});else q=q.order('created_at',{ascending:false});
  q=q.range(range[0],range[1]);
  const {data,error}=await q;if(error){console.warn('products',error.message);return[];}return data||[];}catch(e){console.warn('products',e);return[];}}
async function getProduct(id){try{const {data,error}=await sb.from('products').select('*,stores(id,name,country,avatar_url)').eq('id',id).maybeSingle();if(error){console.warn('product',error.message);return null;}return data;}catch(e){return null;}}
async function getProductMedia(pid){return await sbSelect('product_media',{eq:[['product_id',pid]]});}

function onAuthClick(){if(S.user){signOut();}else{go('auth');}}
async function signOut(){await fauth.signOut();toast(t('signout'));go('home');}
async function googleSignIn(){try{await fauth.signInWithPopup(new firebase.auth.GoogleAuthProvider());toast(t('welcome')+' 👋','success');go('account');}catch(e){toast(e.message,'error');}}
async function emailSignIn(){const e=$('#aEmail').value.trim(),p=$('#aPass').value;if(!e||!p)return toast(t('error'),'error');try{await fauth.signInWithEmailAndPassword(e,p);toast(t('welcome'),'success');go('account');}catch(err){toast(err.message,'error');}}
async function emailSignUp(){const n=$('#aName').value.trim(),e=$('#aEmail').value.trim(),p=$('#aPass').value;if(!e||!p)return toast(t('error'),'error');try{const cred=await fauth.createUserWithEmailAndPassword(e,p);if(n)await cred.user.updateProfile({displayName:n});await ensureProfile(cred.user);toast(t('welcome')+' 🎉','success');go('account');}catch(err){toast(err.message,'error');}}
async function ensureProfile(u){try{const {data}=await sb.from('profiles').select('*').eq('id',u.uid).maybeSingle();if(data)return data;const ins={id:u.uid,display_name:u.displayName||u.email||'User',avatar_url:u.photoURL||null,email:u.email||null,is_seller:false};const {data:d2,error}=await sb.from('profiles').insert(ins).select().single();if(error){console.warn('profile insert',error.message);return ins;}return d2;}catch(e){console.warn('ensureProfile',e);return null;}}
fauth.onAuthStateChanged(async u=>{S.user=u;if(u){S.profile=await ensureProfile(u);try{const st=await sbSelect('stores',{eq:[['owner_uid',u.uid]],limit:1});S.store=st[0]||null;}catch(e){S.store=null;}loadFavorites();loadNotifCount();startNotifPoll();}else{S.profile=null;S.store=null;S.favIds.clear();stopNotifPoll();}updateAuthUI();render();});
function updateAuthUI(){const el=$('#authBtn');if(el)el.textContent=S.user?t('signout'):t('signin');}

async function createStore(){const name=$('#stName').value.trim();if(!name)return toast(t('error'),'error');try{const {data,error}=await sb.from('stores').insert({owner_uid:S.user.uid,name,country:$('#stCountry').value,description:$('#stDesc').value}).select().single();if(error)throw error;S.store=data;await sb.from('profiles').update({is_seller:true}).eq('id',S.user.uid);toast(t('create_store')+' ✓','success');renderSellerDash();}catch(e){toast(e.message,'error');}}
async function loadMyProducts(){const prods=await sbSelect('products',{eq:[['seller_uid',S.user.uid]]});const grid=$('#myProducts');if(!grid)return;grid.innerHTML=prods.length?prods.map(p=>`<div class="bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 rounded-2xl p-3"><div class="font-semibold text-sm line-clamp-2 text-slate-900 dark:text-slate-100">${esc(p.name)}</div><div class="text-gold-600 font-bold">${money(p.price,p.currency)}</div><div class="text-xs text-slate-500 dark:text-slate-400">${p.status}</div><div class="flex gap-2 mt-2"><button onclick="toggleProductStatus('${p.id}','${p.status==='active'?'paused':'active'}')" class="text-xs underline text-slate-700 dark:text-slate-200">${p.status==='active'?t('pause'):t('activate')}</button><button onclick="deleteProduct('${p.id}')" class="text-xs underline text-red-600">${t('delete')}</button></div></div>`).join(''):`<div class="col-span-full text-center py-10 text-slate-500 dark:text-slate-400">${t('empty_products')}</div>`;}
function openProductForm(){openModal(`<h3 class="font-serif text-xl font-bold mb-3 text-slate-900 dark:text-slate-100">${t('add_product')}</h3><input id="pName" placeholder="${t('product_name')}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100 mb-2"/><textarea id="pDesc" rows="3" placeholder="${t('description')}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100 mb-2"></textarea><div class="grid grid-cols-2 gap-2"><input id="pPrice" type="number" placeholder="${t('price')}" class="px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100"/><input id="pStock" type="number" placeholder="${t('stock')}" class="px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-white dark:bg-navy-800 text-slate-900 dark:text-slate-100"/></div><input id="pImg" type="file" accept="image/*" multiple class="mt-2 text-sm"/><button onclick="saveProduct()" class="mt-3 w-full btn-gold py-3 rounded-xl text-white font-semibold">${t('publish')}</button>`);}
async function saveProduct(){if(!S.store)return toast(t('create_store'),'error');const name=$('#pName').value.trim(),price=+$('#pPrice').value;if(!name||!price)return toast(t('error'),'error');try{const {data:prod,error}=await sb.from('products').insert({seller_uid:S.user.uid,store_id:S.store.id,name,description:$('#pDesc').value,price,currency:'USD',stock:+$('#pStock').value||0,status:'active',is_restricted:false,delivery_available:true}).select().single();if(error)throw error;const files=$('#pImg').files;if(files&&files.length){for(const f of files){try{const {error:ue}=await sb.storage.from('media').upload(`products/${prod.id}/${Date.now()}_${f.name}`,f);if(!ue){const {data:pub}=sb.storage.from('media').getPublicUrl(`products/${prod.id}/${Date.now()}_${f.name}`);await sb.from('product_media').insert({product_id:prod.id,url:pub.publicUrl,type:'image'});}}catch(err){console.warn('upload',err);}}closeModal();toast(t('publish')+' ✓','success');loadMyProducts();}}catch(e){toast(e.message,'error');}}

/* ================= SETTINGS ================= */
function renderSettings(){const v=$('#view');if(!S.user)return renderAuth();const p=S.profile||{};
 v.innerHTML=`<div class="max-w-2xl mx-auto px-4 py-8"><h1 class="font-serif text-2xl font-bold mb-4 text-slate-900 dark:text-slate-100">${t('settings')}</h1><div class="bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 rounded-2xl p-5 space-y-4"><div><label class="text-sm font-semibold block mb-1 text-slate-700 dark:text-slate-200">${t('display_name')}</label><input id="setName" value="${esc(p.display_name||'')}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-slate-50 dark:bg-navy-800 text-slate-900 dark:text-slate-100"/></div><div><label class="text-sm font-semibold block mb-1 text-slate-700 dark:text-slate-200">${t('language')}</label><select id="setLang" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-navy-700 bg-slate-50 dark:bg-navy-800 text-slate-900 dark:text-slate-100"><option value="en" ${S.lang==='en'?'selected':''}>English</option><option value="sw" ${S.lang==='sw'?'selected':''}>Kiswahili</option><option value="fr" ${S.lang==='fr'?'selected':''}>Français</option><option value="ar" ${S.lang==='ar'?'selected':''}>العربية</option></select></div><div class="flex items-center justify-between"><label class="text-sm font-semibold text-slate-700 dark:text-slate-200">${t('dark_mode')}</label><button onclick="toggleDark()" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-navy-700 text-slate-700 dark:text-slate-200">${document.documentElement.classList.contains('dark')?'On':'Off'}</button></div><button onclick="saveSettings()" class="btn-gold px-6 py-2.5 rounded-xl text-white">${t('save')}</button></div></div>`;}
async function saveSettings(){try{const name=$('#setName').value;await sb.from('profiles').update({display_name:name}).eq('id',S.user.uid);if(S.profile)S.profile.display_name=name;setLang($('#setLang').value);toast(t('save')+' ✓','success');}catch(e){toast(e.message,'error');}}

/* ================= STATIC ================= */

function renderAbout(){const v=$('#view');v.innerHTML=`<div class="max-w-3xl mx-auto px-4 py-10"><h1 class="font-serif text-2xl font-bold mb-4 text-slate-900 dark:text-slate-100">${t('about')}</h1><div class="bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 rounded-2xl p-5 text-sm text-slate-700 dark:text-slate-200">${t('tagline')}</div></div>`;}
function renderStatic(k){const v=$('#view');v.innerHTML=`<div class="max-w-3xl mx-auto px-4 py-10"><h1 class="font-serif text-2xl font-bold mb-4 text-slate-900 dark:text-slate-100">${t(k)}</h1><div class="bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 rounded-2xl p-5 text-sm text-slate-700 dark:text-slate-200">${t(k)} — Star Universal Trade · Gaby International</div></div>`;}

/* ================= HELPERS ================= */
function skel(n){let s='';for(let i=0;i<n;i++)s+='<div class="rounded-2xl overflow-hidden border border-slate-200 dark:border-navy-800"><div class="aspect-square skeleton"></div><div class="p-3 space-y-2"><div class="h-3 skeleton rounded"></div><div class="h-3 skeleton rounded w-2/3"></div></div></div>';return s;}
function renderMobileNav(){const n=$('#mobileNav');n.innerHTML=[['home',t('home')],['browse',t('browse')],['categories',t('categories')],['messages',t('messages')],['account',t('account')],['settings',t('settings')]].map(x=>`<button onclick="go('${x[0]}');toggleMobileNav()" class="px-3 py-2 rounded-xl text-left text-slate-700 dark:text-slate-200">${x[1]}</button>`).join('');}

/* ================= INIT ================= */
if(localStorage.getItem('sut_theme')==='dark'){document.documentElement.classList.add('dark');$('#theme-icon').textContent='☀️';}
applyI18n();
const initial=location.hash.replace('#/','')||'home';S.route=initial.split('/')[0];S.routeArg=initial.split('/')[1];render();
</script>
