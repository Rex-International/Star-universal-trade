<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Star Universal Trade — Global Trade. Trusted Connections.</title><meta name="description" content="A global marketplace connecting buyers and sellers directly."><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:'#0b3b66',accent:'#f59e0b'}}}}</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Inter,system-ui,sans-serif}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:8px}.glass{backdrop-filter:blur(12px);background:rgba(255,255,255,.82)}.dark .glass{background:rgba(15,23,42,.82)}.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}</style></head><body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-white"><div id="app"></div><div id="modal"></div><div id="toast" class="fixed right-4 bottom-5 z-[100] space-y-2"></div><script>
const SUPA_URL='https://zlgotqylojdktgrrewue.supabase.co';
const SUPA_KEY='sb_publishable_QZ0osNOA2OX6lz67MTrJ_g_MQfsuZzP';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const CURRENCIES={USD:'US Dollar',TZS:'Tanzanian Shilling',KES:'Kenyan Shilling',UGX:'Ugandan Shilling',EUR:'Euro',GBP:'British Pound',AED:'UAE Dirham',SAR:'Saudi Riyal',CNY:'Chinese Yuan',INR:'Indian Rupee',ZAR:'South African Rand',NGN:'Nigerian Naira',JPY:'Japanese Yen',CAD:'Canadian Dollar',AUD:'Australian Dollar'};
const SYMBOLS={USD:'$',TZS:'TSh',KES:'KSh',UGX:'USh',EUR:'€',GBP:'£',AED:'د.إ',SAR:'﷼',CNY:'¥',INR:'₹',ZAR:'R',NGN:'₦',JPY:'¥',CAD:'C$',AUD:'A$'};
const CATS=[['Electronics','https://images.unsplash.com/photo-1498049794561-7780e7231661?auto=format&fit=crop&w=600&q=80'],['Fashion','https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=600&q=80'],['Vehicles','https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=600&q=80'],['Real Estate','https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=600&q=80'],['Agriculture','https://images.unsplash.com/photo-1625246333195-78d9c38ad449?auto=format&fit=crop&w=600&q=80'],['Machinery','https://images.unsplash.com/photo-1581092918056-0c4c3acd3789?auto=format&fit=crop&w=600&q=80'],['Furniture','https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=600&q=80'],['Beauty','https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=600&q=80'],['Health','https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=600&q=80'],['Phones','https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=600&q=80'],['Services','https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=600&q=80'],['Jobs','https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=600&q=80']];
let S={user:null,profile:null,route:'home',products:[],stores:[],requests:[],selected:null,store:null,loading:false,search:'',cat:'',min:'',max:'',currency:'USD',authChecked:false};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(n,c){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c,maximumFractionDigits:2}).format(Number(n)||0)}catch{return `${SYMBOLS[c]||c} ${Number(n)||0}`}}
function toast(m,ok=true){const d=document.createElement('div');d.className=`px-4 py-3 rounded-xl shadow-xl text-sm font-semibold ${ok?'bg-emerald-600':'bg-red-600'} text-white`;d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3500)}
function nav(r){S.route=r;S.selected=null;S.store=null;location.hash='#/'+r;render()}
function img(url,alt=''){return url?`<img src="${esc(url)}" alt="${esc(alt)}" class="w-full h-full object-cover" loading="lazy" onerror="this.src='https://placehold.co/600x450?text=No+Image'">`:`<div class="w-full h-full grid place-items-center bg-slate-200 dark:bg-slate-800 text-slate-400 text-4xl">📷</div>`}
async function loadProfile(){if(!S.user)return;let {data}=await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle();if(!data){let p={id:S.user.id,email:S.user.email,display_name:S.user.user_metadata?.full_name||S.user.email?.split('@')[0]||'User',avatar_url:S.user.user_metadata?.avatar_url||null,is_seller:false,phone:null};let x=await sb.from('profiles').insert(p).select().single();data=x.data||p}S.profile=data}
async function loadProducts(){let q=sb.from('products').select('*,stores(id,name,slug,location,phone,social_links),product_media(*)').eq('status','active').order('created_at',{ascending:false}).limit(100);if(S.cat)q=q.eq('category',S.cat);if(S.search)q=q.or(`title.ilike.%${S.search}%,description.ilike.%${S.search}%`);if(S.currency)q=q.eq('currency',S.currency);if(S.min)q=q.gte('price',Number(S.min));if(S.max)q=q.lte('price',Number(S.max));let {data,error}=await q;if(error){console.error(error);S.products=[]}else S.products=data||[]}
async function loadStores(){let {data}=await sb.from('stores').select('*,profiles(display_name,phone)').order('created_at',{ascending:false}).limit(100);S.stores=data||[]}
async function loadRequests(){let {data}=await sb.from('public_orders').select('*,profiles(display_name,phone)').order('created_at',{ascending:false}).limit(100);S.requests=data||[]}
function header(){return `<header class="sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800 glass"><div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3"><button onclick="nav('home')" class="font-black text-lg whitespace-nowrap">⭐ SUT</button><div class="hidden md:flex flex-1 max-w-xl relative"><input id="topsearch" value="${esc(S.search)}" onkeydown="if(event.key==='Enter'){S.search=this.value;nav('browse')}" class="w-full rounded-xl border px-4 py-2 bg-white/80 dark:bg-slate-900" placeholder="Search products, stores and services..."><button onclick="S.search=$('#topsearch').value;nav('browse')" class="absolute right-1 top-1 bottom-1 px-4 rounded-lg bg-brand text-white">Search</button></div><div class="ml-auto flex gap-2 items-center"><button onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-lg border">🌓</button>${S.user?`<button onclick="nav('requests')" class="p-2 rounded-lg border">📣</button><button onclick="nav('messages')" class="p-2 rounded-lg border">💬</button><button onclick="nav('account')" class="px-3 py-2 rounded-xl bg-brand text-white">Account</button>`:`<button onclick="nav('auth')" class="px-3 py-2 rounded-xl bg-brand text-white">Sign in</button>`}</div></div><div class="md:hidden px-4 pb-3"><input value="${esc(S.search)}" onkeydown="if(event.key==='Enter'){S.search=this.value;nav('browse')}" class="w-full rounded-xl border px-4 py-2 bg-white dark:bg-slate-900" placeholder="Search..."></div></header>`}
function layout(content){$('#app').innerHTML=header()+`<main class="max-w-7xl mx-auto px-4 py-6">${content}</main><footer class="mt-12 border-t py-10"><div class="max-w-7xl mx-auto px-4 grid md:grid-cols-3 gap-6"><div><b>Star Universal Trade</b><p class="text-sm text-slate-500 mt-2">Global Trade. Trusted Connections. Discover products, stores and real buying opportunities.</p></div><div><b>Explore</b><div class="mt-2 space-y-1 text-sm"><button onclick="nav('browse')" class="block">Browse Products</button><button onclick="nav('stores')" class="block">Browse Stores</button><button onclick="nav('requests')" class="block">Public Buying Requests</button></div></div><div><b>For sellers</b><p class="text-sm text-slate-500 mt-2">Create your storefront, publish products and connect directly with buyers.</p></div></div></footer>`}
function productCard(p){let m=p.product_media?.[0]?.url||p.image_url;return `<article class="bg-white dark:bg-slate-900 rounded-2xl overflow-hidden border shadow-sm hover:shadow-lg transition cursor-pointer" onclick="openProduct('${p.id}')"><div class="aspect-[4/3] bg-slate-100">${img(m,p.title)}</div><div class="p-4"><div class="font-bold line-clamp-2">${esc(p.title)}</div><div class="text-lg font-black mt-2">${money(p.price,p.currency)}</div><div class="text-xs text-slate-500 mt-1">${esc(p.stores?.name||'Independent seller')} · ${esc(p.stores?.location||p.location||'Location not set')}</div><div class="flex gap-2 mt-3 flex-wrap"><span class="text-xs px-2 py-1 rounded-full bg-slate-100 dark:bg-slate-800">${p.delivery_available?'🚚 Delivery':'📦 Pickup'}</span></div></div></article>`}
function hero(){return `<section class="rounded-3xl bg-gradient-to-br from-brand to-slate-900 text-white p-7 md:p-12"><div class="max-w-3xl"><span class="inline-block px-3 py-1 rounded-full bg-white/10 text-sm">🌍 Global marketplace</span><h1 class="text-4xl md:text-6xl font-black mt-4">Global Trade.<br>Trusted Connections.</h1><p class="mt-5 text-lg text-white/80">Buy, sell, discover stores and publish what you need. SUT connects people directly—without taking over their payment arrangements.</p><div class="flex gap-3 mt-7 flex-wrap"><button onclick="nav('browse')" class="px-5 py-3 bg-white text-brand rounded-xl font-bold">Browse Products</button><button onclick="nav('requests')" class="px-5 py-3 bg-accent text-slate-950 rounded-xl font-bold">📣 Post What You Need</button></div></div></section>`}
function home(){layout(`${hero()}<section class="mt-8"><div class="flex justify-between items-end mb-4"><div><h2 class="text-2xl font-black">Shop by Category</h2><p class="text-sm text-slate-500">Explore global categories visually.</p></div><button onclick="nav('browse')" class="text-brand font-bold">View all →</button></div><div class="flex gap-4 overflow-x-auto pb-3">${CATS.map(c=>`<button onclick="S.cat='${esc(c[0])}';nav('browse')" class="min-w-32 text-left"><div class="h-24 rounded-2xl overflow-hidden">${img(c[1],c[0])}</div><div class="font-semibold text-sm mt-2">${esc(c[0])}</div></button>`).join('')}</div></section><section class="mt-10"><div class="flex justify-between items-end mb-4"><div><h2 class="text-2xl font-black">Featured Products</h2><p class="text-sm text-slate-500">Fresh listings from the SUT marketplace.</p></div><button onclick="nav('browse')" class="text-brand font-bold">Browse →</button></div>${S.products.length?`<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${S.products.slice(0,8).map(productCard).join('')}</div>`:`<div class="p-8 rounded-2xl border border-dashed text-center text-slate-500">No products yet. Be the first seller to publish.</div>`}</section><section class="mt-10 grid md:grid-cols-3 gap-4"><button onclick="nav('stores')" class="p-6 rounded-2xl bg-white dark:bg-slate-900 border text-left"><b>🏪 Browse Stores</b><p class="text-sm text-slate-500 mt-2">Explore seller storefronts, contacts and social links.</p></button><button onclick="nav('requests')" class="p-6 rounded-2xl bg-white dark:bg-slate-900 border text-left"><b>📣 Public Buying Requests</b><p class="text-sm text-slate-500 mt-2">Tell sellers exactly what you are looking for and your budget.</p></button><button onclick="nav('dashboard')" class="p-6 rounded-2xl bg-white dark:bg-slate-900 border text-left"><b>🚀 Start Selling</b><p class="text-sm text-slate-500 mt-2">Create a store and publish products with live upload progress.</p></button></section>`)}
function browse(){let opts=Object.entries(CURRENCIES).map(([k,v])=>`<option value="${k}" ${S.currency===k?'selected':''}>${k} — ${v}</option>`).join('');layout(`<div class="flex flex-wrap gap-2 items-end mb-6"><div><label class="text-xs font-bold">Currency</label><select onchange="S.currency=this.value;refreshBrowse()" class="block border rounded-xl px-3 py-2 bg-white dark:bg-slate-900">${opts}</select></div><div><label class="text-xs font-bold">Min price (${S.currency})</label><input id="min" value="${esc(S.min)}" type="number" min="0" class="block border rounded-xl px-3 py-2 bg-white dark:bg-slate-900" placeholder="0"></div><div><label class="text-xs font-bold">Max price (${S.currency})</label><input id="max" value="${esc(S.max)}" type="number" min="0" class="block border rounded-xl px-3 py-2 bg-white dark:bg-slate-900" placeholder="Any"></div><button onclick="S.min=$('#min').value;S.max=$('#max').value;refreshBrowse()" class="px-4 py-2 rounded-xl bg-brand text-white font-bold">Apply</button><button onclick="S.min='';S.max='';S.cat='';S.search='';refreshBrowse()" class="px-4 py-2 rounded-xl border">Reset</button></div><div class="mb-5"><h1 class="text-3xl font-black">Browse Products</h1><p class="text-slate-500">Price filters are currency-aware: choose the currency before setting min/max.</p></div>${S.products.length?`<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">${S.products.map(productCard).join('')}</div>`:`<div class="p-12 rounded-2xl border border-dashed text-center text-slate-500">No matching products in ${S.currency}. Try another currency or clear filters.</div>`}`)}
async function refreshBrowse(){await loadProducts();browse()}
function stores(){layout(`<div class="mb-6"><h1 class="text-3xl font-black">Browse Stores</h1><p class="text-slate-500">Discover seller storefronts, products, location and direct contact.</p></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${S.stores.map(s=>`<article class="bg-white dark:bg-slate-900 border rounded-2xl p-5"><div class="h-24 rounded-xl bg-gradient-to-br from-brand to-slate-800 grid place-items-center text-4xl text-white">🏪</div><h3 class="font-black text-lg mt-4">${esc(s.name)}</h3><p class="text-sm text-slate-500">📍 ${esc(s.location||'Location not set')}</p><p class="text-sm mt-2">${esc(s.description||'Global seller storefront')}</p><button onclick="openStore('${s.id}')" class="mt-4 w-full py-2 rounded-xl bg-brand text-white font-bold">Visit Store</button></article>`).join('')}</div>`)}
async function openStore(id){let {data}=await sb.from('stores').select('*,profiles(display_name,phone)').eq('id',id).single();S.store=data;let {data:ps}=await sb.from('products').select('*,product_media(*)').eq('store_id',id).eq('status','active').order('created_at',{ascending:false});S.products=ps||[];layout(`<button onclick="nav('stores')" class="mb-4 text-brand font-bold">← Stores</button><section class="bg-white dark:bg-slate-900 border rounded-3xl p-6"><div class="flex flex-col md:flex-row gap-5"><div class="h-28 w-28 rounded-2xl bg-brand text-white grid place-items-center text-5xl">🏪</div><div class="flex-1"><h1 class="text-3xl font-black">${esc(S.store.name)}</h1><p class="text-slate-500 mt-1">📍 ${esc(S.store.location||'Location not set')}</p><p class="mt-3">${esc(S.store.description||'')}</p><div class="flex gap-2 mt-4 flex-wrap">${S.store.phone?`<a class="px-3 py-2 rounded-xl bg-emerald-600 text-white" href="https://wa.me/${S.store.phone.replace(/\D/g,'')}">WhatsApp</a><a class="px-3 py-2 rounded-xl border" href="tel:${esc(S.store.phone)}">Call</a>`:''}${socialButtons(S.store.social_links)}</div></div><button onclick="followStore('${S.store.id}')" class="px-4 py-2 rounded-xl border h-fit">♡ Follow Store</button></div></section><h2 class="text-2xl font-black mt-8 mb-4">Store Products</h2><div class="grid grid-cols-2 md:grid-cols-4 gap-4">${S.products.map(productCard).join('')||'<p class="text-slate-500">No products published yet.</p>'}</div>`)}
function socialButtons(x){if(!x)return '';let labels={instagram:'Instagram',facebook:'Facebook',tiktok:'TikTok',website:'Website'};return Object.entries(x).filter(([,v])=>v).map(([k,v])=>`<a target="_blank" class="px-3 py-2 rounded-xl border" href="${esc(v)}">${labels[k]||k}</a>`).join('')}
async function followStore(id){if(!S.user)return nav('auth');let {error}=await sb.from('store_followers').upsert({store_id:id,user_id:S.user.id},{onConflict:'store_id,user_id'});toast(error?error.message:'Store followed — you will receive new-product notifications!',!error)}
async function openProduct(id){let {data,error}=await sb.from('products').select('*,stores(*),product_media(*)').eq('id',id).single();if(error)return toast(error.message,false);S.selected=data;layout(`<button onclick="history.back()" class="text-brand font-bold mb-4">← Back</button><section class="grid lg:grid-cols-2 gap-7"><div><div class="aspect-square rounded-3xl overflow-hidden bg-slate-100">${img(S.selected.product_media?.[0]?.url||S.selected.image_url,S.selected.title)}</div><div class="grid grid-cols-5 gap-2 mt-3">${(S.selected.product_media||[]).slice(0,5).map(m=>`<div class="aspect-square rounded-lg overflow-hidden">${img(m.url,'')}</div>`).join('')}</div></div><div><div class="text-sm text-brand font-bold">${esc(S.selected.category||'Marketplace')}</div><h1 class="text-4xl font-black mt-2">${esc(S.selected.title)}</h1><div class="text-3xl font-black mt-4">${money(S.selected.price,S.selected.currency)}</div><p class="text-sm text-slate-500 mt-1">Currency: ${esc(S.selected.currency)}</p><p class="mt-5 whitespace-pre-line">${esc(S.selected.description||'No description')}</p><div class="mt-5 p-4 rounded-2xl bg-slate-100 dark:bg-slate-800"><b>🚚 Delivery</b><p class="text-sm mt-1">${S.selected.delivery_available?'Available':'Not available / pickup'}</p><p class="text-sm mt-1">Status: <b>${esc(S.selected.delivery_status||'Not started')}</b></p></div><div class="mt-5 p-4 rounded-2xl border"><b>Seller</b><p>${esc(S.selected.stores?.name||'Seller')}</p><p class="text-sm text-slate-500">📍 ${esc(S.selected.stores?.location||S.selected.location||'Location not set')}</p><div class="flex gap-2 mt-3 flex-wrap">${contactButtons(S.selected.stores?.phone)}</div></div><div class="flex gap-2 mt-4"><button onclick="shareProduct('${S.selected.id}')" class="px-4 py-3 rounded-xl border font-bold">📤 Recommend / Share</button><button onclick="startChat('${S.selected.stores?.owner_uid||S.selected.seller_id}')" class="px-4 py-3 rounded-xl bg-brand text-white font-bold">💬 Message Seller</button></div></div></section>`)}
function contactButtons(phone){if(!phone)return '<span class="text-sm text-slate-500">Seller has not provided a phone number.</span>';let p=phone.replace(/\D/g,'');return `<a href="https://wa.me/${p}" target="_blank" class="px-3 py-2 rounded-xl bg-emerald-600 text-white">WhatsApp</a><a href="tel:${esc(phone)}" class="px-3 py-2 rounded-xl bg-brand text-white">Call</a><a href="sms:${esc(phone)}" class="px-3 py-2 rounded-xl border">Text</a>`}
async function shareProduct(id){let url=location.origin+location.pathname+'#/product/'+id;try{if(navigator.share)await navigator.share({title:S.selected?.title||'SUT product',text:'Check this product on Star Universal Trade',url});else await navigator.clipboard.writeText(url);toast('Product link ready to share')}catch{}}
function auth(){layout(`<div class="max-w-md mx-auto bg-white dark:bg-slate-900 border rounded-3xl p-7"><h1 class="text-3xl font-black">Welcome to SUT</h1><p class="text-slate-500 mt-2">Sign in to buy, sell, message and post buying requests.</p><button onclick="googleLogin()" class="w-full mt-6 py-3 rounded-xl border font-bold">Continue with Google</button><div class="my-5 text-center text-xs text-slate-400">OR EMAIL</div><input id="email" class="w-full border rounded-xl p-3 mb-3 bg-transparent" placeholder="Email"><input id="pass" type="password" class="w-full border rounded-xl p-3 bg-transparent" placeholder="Password"><div class="grid grid-cols-2 gap-3 mt-3"><button onclick="emailAuth('signin')" class="py-3 rounded-xl bg-brand text-white font-bold">Sign in</button><button onclick="emailAuth('signup')" class="py-3 rounded-xl border font-bold">Create account</button></div></div>`)}
async function googleLogin(){let {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin,queryParams:{prompt:'select_account'}}});if(error)toast(error.message,false)}
async function emailAuth(mode){let e=$('#email').value,p=$('#pass').value;if(mode==='signup'){let {error}=await sb.auth.signUp({email:e,password:p});if(error)toast(error.message,false);else toast('Account created. Check email if confirmation is enabled.')}else{let {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)toast(error.message,false)}}
function requests(){layout(`<div class="flex justify-between items-end mb-6"><div><h1 class="text-3xl font-black">Public Buying Requests</h1><p class="text-slate-500">Buyers publish what they need; sellers can discover and respond.</p></div><button onclick="requireAuth('request')" class="px-4 py-3 rounded-xl bg-accent font-bold">+ Post a Request</button></div><div class="grid md:grid-cols-2 gap-4">${S.requests.map(r=>`<article class="bg-white dark:bg-slate-900 border rounded-2xl p-5"><div class="flex justify-between gap-3"><h3 class="text-xl font-black">${esc(r.title||r.product_name)}</h3><span class="px-2 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-xs">${esc(r.status||'open')}</span></div><p class="mt-3 text-sm whitespace-pre-line">${esc(r.description||'')}</p><div class="font-bold mt-3">Budget: ${money(r.budget,r.currency)}</div><div class="text-sm text-slate-500 mt-1">📍 ${esc(r.location||'Location not specified')}</div><div class="text-sm text-slate-500 mt-1">Contact: ${r.contact_phone?esc(r.contact_phone):'Private'}</div>${S.user&&r.buyer_id!==S.user.id?`<button onclick="respondRequest('${r.id}')" class="mt-4 px-4 py-2 rounded-xl bg-brand text-white font-bold">Respond / Offer</button>`:''}</article>`).join('')||'<div class="p-10 border border-dashed rounded-2xl text-center text-slate-500 md:col-span-2">No public requests yet.</div>'}</div>`)}
function requireAuth(type){if(!S.user)return nav('auth');if(type==='request')return requestForm()}
function requestForm(){let opts=Object.keys(CURRENCIES).map(c=>`<option>${c}</option>`).join('');openModal(`<h2 class="text-2xl font-black">Post a Public Buying Request</h2><p class="text-sm text-slate-500 mt-1">Sellers will be notified when this is published.</p><input id="rqtitle" class="w-full border rounded-xl p-3 mt-5" placeholder="What are you looking for?"><textarea id="rqdesc" class="w-full border rounded-xl p-3 mt-3" rows="4" placeholder="Describe exactly what you need..."></textarea><div class="grid grid-cols-2 gap-3 mt-3"><input id="rqb" type="number" min="0" class="border rounded-xl p-3" placeholder="Budget"><select id="rqc" class="border rounded-xl p-3">${opts}</select></div><input id="rqloc" class="w-full border rounded-xl p-3 mt-3" placeholder="Your location"><input id="rqphone" class="w-full border rounded-xl p-3 mt-3" placeholder="Your phone / WhatsApp"><label class="flex gap-2 items-center mt-3"><input id="rqdel" type="checkbox"> I need delivery</label><button onclick="publishRequest()" class="w-full py-3 rounded-xl bg-brand text-white font-bold mt-5">Publish Request</button>`)}
async function publishRequest(){let v={buyer_id:S.user.id,title:$('#rqtitle').value,description:$('#rqdesc').value,budget:Number($('#rqb').value),currency:$('#rqc').value,location:$('#rqloc').value,contact_phone:$('#rqphone').value,delivery_required:$('#rqdel').checked,status:'open'};if(!v.title||!v.description||!v.budget||!v.contact_phone)return toast('Fill title, description, budget and contact.',false);let {error}=await sb.from('public_orders').insert(v);if(error)return toast(error.message,false);closeModal();await loadRequests();toast('Request published. Sellers have been notified.');requests()}
function respondRequest(id){if(!S.user)return nav('auth');openModal(`<h2 class="text-2xl font-black">Send Seller Offer</h2><input id="off" type="number" min="0" class="w-full border rounded-xl p-3 mt-5" placeholder="Your offer"><select id="offc" class="w-full border rounded-xl p-3 mt-3">${Object.keys(CURRENCIES).map(c=>`<option>${c}</option>`).join('')}</select><textarea id="offm" class="w-full border rounded-xl p-3 mt-3" rows="4" placeholder="Message to buyer"></textarea><button onclick="sendOffer('${id}')" class="w-full py-3 rounded-xl bg-brand text-white font-bold mt-4">Send Offer</button>`)}
async function sendOffer(id){let {error}=await sb.from('public_order_responses').insert({public_order_id:id,seller_id:S.user.id,offer_price:Number($('#off').value),currency:$('#offc').value,message:$('#offm').value});if(error)toast(error.message,false);else{closeModal();toast('Offer sent to buyer.')}}
function dashboard(){if(!S.user)return nav('auth');layout(`<div class="flex justify-between items-end mb-6"><div><h1 class="text-3xl font-black">Seller Dashboard</h1><p class="text-slate-500">Publish products with transparent upload progress.</p></div><button onclick="storeForm()" class="px-4 py-3 rounded-xl border font-bold">🏪 Store settings</button></div><div class="grid md:grid-cols-3 gap-4"><div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border"><b>Account</b><p class="mt-2">${esc(S.profile?.display_name||S.user.email)}</p><p class="text-sm text-slate-500">${esc(S.user.email||'')}</p></div><div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border"><b>Seller status</b><p class="mt-2">${S.profile?.is_seller?'Seller':'Buyer'}</p></div><div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border"><b>Next</b><p class="mt-2">Publish a product or create your store.</p></div></div><button onclick="productForm()" class="mt-7 px-6 py-4 rounded-2xl bg-brand text-white font-black">+ Publish Product</button>`)}
function storeForm(){openModal(`<h2 class="text-2xl font-black">Create / Update Store</h2><input id="sn" class="w-full border rounded-xl p-3 mt-5" placeholder="Store name"><input id="sloc" class="w-full border rounded-xl p-3 mt-3" placeholder="Store location"><textarea id="sdesc" class="w-full border rounded-xl p-3 mt-3" rows="3" placeholder="Store description"></textarea><input id="sphone" class="w-full border rounded-xl p-3 mt-3" placeholder="Phone / WhatsApp"><input id="sinsta" class="w-full border rounded-xl p-3 mt-3" placeholder="Instagram URL (optional)"><input id="sfb" class="w-full border rounded-xl p-3 mt-3" placeholder="Facebook URL (optional)"><input id="stt" class="w-full border rounded-xl p-3 mt-3" placeholder="TikTok URL (optional)"><input id="sweb" class="w-full border rounded-xl p-3 mt-3" placeholder="Website URL (optional)"><button onclick="saveStore()" class="w-full py-3 rounded-xl bg-brand text-white font-bold mt-5">Save Store</button>`)}
async function saveStore(){let x={owner_uid:S.user.id,name:$('#sn').value,location:$('#sloc').value,description:$('#sdesc').value,phone:$('#sphone').value,social_links:{instagram:$('#sinsta').value,facebook:$('#sfb').value,tiktok:$('#stt').value,website:$('#sweb').value}};let {error}=await sb.from('stores').upsert(x,{onConflict:'owner_uid'});if(error)toast(error.message,false);else{await sb.from('profiles').update({is_seller:true,phone:x.phone}).eq('id',S.user.id);closeModal();await loadStores();toast('Store saved.')}}
function productForm(){openModal(`<h2 class="text-2xl font-black">Publish Product</h2><p class="text-sm text-slate-500">Choose gallery or camera. Images upload with live progress.</p><input id="pt" class="w-full border rounded-xl p-3 mt-5" placeholder="Product title"><textarea id="pd" class="w-full border rounded-xl p-3 mt-3" rows="4" placeholder="Description"></textarea><div class="grid grid-cols-2 gap-3 mt-3"><input id="pp" type="number" min="0" class="border rounded-xl p-3" placeholder="Price"><select id="pc" class="border rounded-xl p-3">${Object.keys(CURRENCIES).map(c=>`<option>${c}</option>`).join('')}</select></div><select id="pca" class="w-full border rounded-xl p-3 mt-3">${CATS.map(c=>`<option>${esc(c[0])}</option>`).join('')}</select><input id="ploc" class="w-full border rounded-xl p-3 mt-3" placeholder="Product location"><input id="pphone" class="w-full border rounded-xl p-3 mt-3" placeholder="Seller phone / WhatsApp"><label class="flex gap-2 items-center mt-3"><input id="pdel" type="checkbox"> Delivery available</label><div class="grid grid-cols-2 gap-3 mt-4"><label class="border rounded-xl p-4 text-center cursor-pointer">🖼️ Gallery<input id="pg" type="file" accept="image/*" multiple class="hidden"></label><label class="border rounded-xl p-4 text-center cursor-pointer">📷 Camera<input id="pcam" type="file" accept="image/*" capture="environment" class="hidden"></label></div><div id="previews" class="grid grid-cols-4 gap-2 mt-3"></div><div id="progress" class="mt-4 hidden"><div class="flex justify-between text-xs"><span id="pstatus">Preparing…</span><span id="ppct">0%</span></div><div class="h-2 bg-slate-200 rounded-full mt-1 overflow-hidden"><div id="pbar" class="h-full bg-brand" style="width:0%"></div></div></div><button id="pubbtn" onclick="publishProduct()" class="w-full py-3 rounded-xl bg-brand text-white font-bold mt-5">Publish Product</button>`);['pg','pcam'].forEach(id=>$( '#'+id).addEventListener('change',previewFiles))}
function previewFiles(){let files=[...($('#pg').files||[]),...($('#pcam').files||[])].slice(0,8);$('#previews').innerHTML=files.map(f=>`<img src="${URL.createObjectURL(f)}" class="aspect-square object-cover rounded-lg">`).join('')}
async function publishProduct(){if(!S.user)return nav('auth');let files=[...($('#pg').files||[]),...($('#pcam').files||[])].slice(0,8);if(!files.length)return toast('Add at least one product image.',false);let title=$('#pt').value.trim(),price=Number($('#pp').value);if(!title||!price)return toast('Title and price are required.',false);let {data:store}=await sb.from('stores').select('id').eq('owner_uid',S.user.id).maybeSingle();if(!store){toast('Create your store first.',false);return storeForm()}$('#pubbtn').disabled=true;$('#progress').classList.remove('hidden');setProgress('Creating product…',5);let product={store_id:store.id,seller_id:S.user.id,title,description:$('#pd').value,price,currency:$('#pc').value,category:$('#pca').value,location:$('#ploc').value,delivery_available:$('#pdel').checked,delivery_status:$('#pdel').checked?'Not started':'Not applicable',status:'active'};let {data:p,error}=await sb.from('products').insert(product).select().single();if(error){setProgress(error.message,0);return finishPublish(false)}let urls=[];for(let i=0;i<files.length;i++){let f=files[i];setProgress(`Uploading image ${i+1} of ${files.length}…`,10+(i/files.length)*75);if(!f.type.startsWith('image/')||f.size>10*1024*1024){toast('Invalid image or image over 10MB.',false);continue}let safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');let path=`${S.user.id}/${p.id}/${Date.now()}_${i}_${safe}`;let up=await sb.storage.from('media').upload(path,f,{contentType:f.type,upsert:false});if(up.error){console.error(up.error);continue}let pub=sb.storage.from('media').getPublicUrl(path);urls.push({product_id:p.id,url:pub.data.publicUrl,storage_path:path});await sb.from('product_media').insert({product_id:p.id,url:pub.data.publicUrl,storage_path:path});}if(!urls.length){await sb.from('products').delete().eq('id',p.id);setProgress('Image upload failed — listing was rolled back.',0);return finishPublish(false)}setProgress('Finalizing listing…',92);await sb.from('products').update({image_url:urls[0].url}).eq('id',p.id);setProgress('Published successfully!',100);await loadProducts();setTimeout(()=>{closeModal();toast('Product published successfully.');nav('browse')},700)}
function setProgress(t,n){$('#pstatus').textContent=t;$('#ppct').textContent=Math.round(n)+'%';$('#pbar').style.width=Math.max(0,n)+'%'}
function finishPublish(ok){$('#pubbtn').disabled=false;if(!ok)setTimeout(()=>{$('#progress').classList.remove('hidden')},10)}
function messages(){layout(`<div class="mb-6"><h1 class="text-3xl font-black">Messages</h1><p class="text-slate-500">Text, image and short audio conversations.</p></div><div class="p-10 border border-dashed rounded-2xl text-center text-slate-500">Select a seller from a product and tap <b>Message Seller</b> to start a conversation.</div>`)}
async function startChat(other){if(!S.user)return nav('auth');if(!other||other===S.user.id)return toast('Seller contact is unavailable.',false);let {data,error}=await sb.rpc('start_conversation',{other_uid:other});if(error)return toast(error.message,false);toast('Conversation ready.');nav('messages')}
function account(){if(!S.user)return nav('auth');layout(`<div class="max-w-2xl"><h1 class="text-3xl font-black">My Account</h1><div class="mt-5 bg-white dark:bg-slate-900 border rounded-2xl p-6"><p class="font-bold">${esc(S.profile?.display_name||S.user.email)}</p><p class="text-slate-500">${esc(S.user.email)}</p><div class="grid sm:grid-cols-2 gap-3 mt-5"><button onclick="nav('dashboard')" class="p-4 rounded-xl border text-left">🚀 Seller Dashboard</button><button onclick="nav('requests')" class="p-4 rounded-xl border text-left">📣 My / Public Requests</button></div><button onclick="sb.auth.signOut().then(()=>nav('home'))" class="mt-5 px-4 py-2 rounded-xl bg-red-600 text-white">Sign out</button></div></div>`)}
function openModal(h){$('#modal').innerHTML=`<div class="fixed inset-0 z-50 bg-black/60 p-4 grid place-items-center"><div class="bg-white dark:bg-slate-900 w-full max-w-lg max-h-[90vh] overflow-auto rounded-3xl p-6 shadow-2xl"><button onclick="closeModal()" class="float-right text-2xl">×</button>${h}</div></div>`}function closeModal(){$('#modal').innerHTML=''}
async function render(){if(S.route==='home'){await loadProducts();return home()}if(S.route==='browse'){await loadProducts();return browse()}if(S.route==='stores'){await loadStores();return stores()}if(S.route==='requests'){await loadRequests();return requests()}if(S.route==='auth')return auth();if(S.route==='dashboard')return dashboard();if(S.route==='messages')return messages();if(S.route==='account')return account();return home()}
function routeFromHash(){let x=location.hash.replace('#/','');if(x.startsWith('product/')){openProduct(x.split('/')[1]);return}if(x.startsWith('store/')){openStore(x.split('/')[1]);return}S.route=x||'home';render()}
sb.auth.onAuthStateChange(async(_,session)=>{S.user=session?.user||null;if(S.user)await loadProfile();S.authChecked=true;routeFromHash()});window.addEventListener('hashchange',routeFromHash);routeFromHash();
</script></body></html>
